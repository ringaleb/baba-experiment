game_env:
  name: "baba_is_you"
  description: "Baba Is You puzzle environment"
  env_type: "custom"
  render_mode: null
  max_steps: 150
  seed: 42
  num_runs: 3

agent:
  # Change model_name per experiment run:
  #   gpt-4o-mini        (OpenAI non-reasoning baseline)
  #   deepseek-chat      (DeepSeek V4 Flash, non-thinking mode)
  #   deepseek-reasoner  (DeepSeek V4 Flash, thinking/CoT mode)
  name: "baba_is_you_agent"
  model_name: "gpt-4o-mini"
  cache_dir: "cache/baba_is_you"
  token_limit: 4096
  harness: true
  observation_mode: "text"
  use_reflection: true
  use_perception: false
  use_summary: false
  use_custom_prompt: false
  modules:
    base_module:

    perception_module:

    memory_module:
      max_memory: 10

    reasoning_module: